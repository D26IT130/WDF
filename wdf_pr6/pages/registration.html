<!-- ================= MAIN ================= -->

<main>

    <section class="login-section">

        <div class="login-box">

            <h2>Create Account</h2>

            <p>
                Register to become a member of Student Hub.
            </p>


            <!-- ================= REGISTRATION FORM ================= -->

            <form id="registrationForm" novalidate>


                <!-- Full Name -->

                <div class="form-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Student ID -->

                <div class="form-group">

                    <label for="studentId">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        name="studentId"
                        placeholder="Enter your student ID"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Terms and Conditions -->

                <div class="form-options">

                    <label class="terms-label">

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                            required
                        >

                        <span>
                            I agree to the
                            <a href="#">
                                Terms & Conditions
                            </a>
                        </span>

                    </label>

                </div>


                <!-- Register Button -->

                <button
                    type="submit"
                    class="btn"
                >
                    Create Account
                </button>


            </form>


            <!-- Login Link -->

            <p class="register-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>

</main>
