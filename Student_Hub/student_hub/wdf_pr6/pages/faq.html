    <!-- Navigation -->

    </nav>

</header>


<!-- ================= MAIN ================= -->

<main>


    <!-- Page Header -->

    <section class="page-header">

        <h2>Frequently Asked Questions</h2>

        <p>
            Find answers to common questions about Student Hub.
        </p>

    </section>


    <!-- ================= FAQ CONTROLS ================= -->

    <section class="event-controls">

        <!-- Search -->

        <div class="event-search">

            <label for="faqSearch">
                Search FAQs
            </label>

            <input
                type="text"
                id="faqSearch"
                placeholder="Search questions..."
            >

        </div>


        <!-- Category Filter -->

        <div class="event-filter">

            <label for="faqCategory">

                Category

            </label>

            <select id="faqCategory">

                <option value="all">
                    All Categories
                </option>

                <option value="General">
                    General
                </option>

                <option value="Courses">
                    Courses
                </option>

                <option value="Notes">
                    Notes
                </option>

                <option value="Events">
                    Events
                </option>

                <option value="Account">
                    Account
                </option>

                <option value="Resources">
                    Resources
                </option>

            </select>

        </div>


        <!-- Sorting -->

        <div class="event-sort">

            <label for="faqSort">
                Sort
            </label>

            <select id="faqSort">

                <option value="default">
                    Default
                </option>

                <option value="questionAsc">
                    Question A-Z
                </option>

                <option value="questionDesc">
                    Question Z-A
                </option>

                <option value="categoryAsc">
                    Category A-Z
                </option>

                <option value="categoryDesc">
                    Category Z-A
                </option>

            </select>

        </div>

    </section>


    <!-- ================= LOADING ================= -->

    <div
        id="faqLoading"
        class="events-message"
    >

        Loading FAQs...

    </div>


    <!-- ================= ERROR ================= -->

    <div
        id="faqError"
        class="events-message error"
        style="display: none;"
    >
    </div>


    <!-- ================= FAQ CONTAINER ================= -->

    <section
        class="faq-section"
        id="faqContainer"
    >
    </section>


    <!-- ================= NO RESULTS ================= -->

    <div
        id="noFaqs"
        class="events-message"
        style="display: none;"
    >

        No FAQs found.

    </div>


    <!-- ================= PAGINATION ================= -->

    <div
        id="faqPagination"
        class="pagination"
    >
    </div>


</main>
