    <title>Student Hub - Registration</title>

    <link rel="stylesheet" href="../css/style1.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <h1>Student Hub</h1>
        </div>

        <button
            class="hamburger"
            id="hamburger"
            type="button"
            aria-label="Open navigation menu"
            aria-controls="mainNav"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="mainNav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.php">Dashboard</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="feedback.html">Feedback</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="registration.html" aria-current="page">Register</a></li>
                <li><a href="../php/logout.php">Logout</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section class="login-section">

            <div class="login-box">

                <h2>Create Account</h2>

                <p>
                    Register to become a member of Student Hub.
                </p>

                <!-- Registration status messages -->
                <div
                    id="formStatus"
                    class="alert"
                    role="status"
                    aria-live="polite"
                    hidden
                ></div>

                <!-- Registration Form -->
                <form
                    id="registerForm"
                    action="../php/register.php"
                    method="POST"
                >

                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="fullname">Full Name</label>

                        <input
                            type="text"
                            id="fullname"
                            name="fullName"
                            placeholder="Enter your full name"
                            minlength="3"
                            maxlength="100"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="registerEmail">Email</label>

                        <input
                            type="email"
                            id="registerEmail"
                            name="email"
                            placeholder="Enter your email"
                            maxlength="255"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <!-- Student ID -->
                    <div class="form-group">
                        <label for="studentId">Student ID</label>

                        <input
                            type="text"
                            id="studentId"
                            name="studentId"
                            placeholder="Enter your student ID"
                            maxlength="50"
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="registerPassword">Password</label>

                        <input
                            type="password"
                            id="registerPassword"
                            name="password"
                            placeholder="Create a password"
                            minlength="6"
                            maxlength="72"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <!-- Confirm Password -->
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            minlength="6"
                            maxlength="72"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <!-- Terms and Conditions -->
                    <div class="form-options">
                        <label class="terms-label">
                            <input
                                type="checkbox"
                                id="terms"
                                name="terms"
                                value="1"
                                required
                            >

                            <span>
                                I agree to the
                                <a href="#" id="termsLink">
                                    Terms &amp; Conditions
                                </a>
                            </span>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button
                        type="submit"
                        class="btn"
                        id="submitBtn"
                    >
                        Create Account
                    </button>

                </form>

                <!-- Login Link -->
                <p class="register-text">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Student Hub. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script src="../js/script.js"></script>
    <script src="../js/register.js"></script>

</body>
</html>
